    <h1>04_link_img</h1>
    <!-- 
    a 태그 : 다른페이지(사이트)로 이동
    href : 도착지
      절대주소 : 전체주소로 페이지 이동 
            https://www.naver.com, E:\public\kt_2026_11\kt_front\basic\day_1\ccc.html
      상대주소 : 현재페이지를 기준으로 페이지 이동
            ../day_1/bbb.html  :  ../ 1단계 위의 폴더로 이동  
            02_text.html : 현재파일과 같은 폴더위치

    텍스트노드 : 클릭시 이동하는 이벤트발생
    <태그>글자</태그>
    태그 : 일반노드
    글자 : 텍스트노드 => 태그안에 들어있는 내용

    target : 이동하는 창 _blank : 새창, _self: 현재창(기본값)
    -->
    <a href="https://www.naver.com/">네이버</a>
    <a href="https://www.daum.net" target="_blank">다음</a>

    <h2>이미지</h2>
    <!--
    img 태그 : 이미지를 삽입 - html 파일내에 이미지가 있는 것이 아니라 지정된 경로에서
                             이미지를 로드하여사용
    src : 이미지경로 , 절대경로, 상대경로 모두가능
    width :  너비,  height : 높이  너비높이 중 1개만 지정할 경우 이미지의 종횡비율을 유지하여 크기조절
                                   2개 모두 조정시 종횡비 유지 안함
    -->
    <img src="../../fff/MYMW7924.JPG" width="200px" alt="">
    <img src="../../fff/MYMW7924.JPG" height="200px" alt="">
    <img src="../../fff/MYMW7924.JPG" height="200px" width="200px" alt="">
    <img src="https://cafeptthumb-phinf.pstatic.net/MjAyMDA4MjdfMjgy/MDAxNTk4NDYyMzgwNzY5.HP952T3SeVS4EeJ_KCpk8QPIuTuqD9kYmT5yjnyZUFEg.elqHvv0xGh0Kf-pBgcj8D9ZycnRJDJm3QGlJnR9GHb8g.JPEG/20180107_173644_IMG_0541.JPG?type=w1600" 
    width="200px" alt="">
    <!-- box 그리기-->
    <div style="width: 500px; height: 200px; border: 1px solid #333; background: #ff0;"></div>
    <div style="width: 500px; height: 200px; border: 1px solid #333; background-image: url('../../fff/PHIS3580.JPG');"></div>
    
    
    <div style="width: 500px; height: 200px; border: 1px solid #333; 
    background-image: url('../../fff/PHIS3580.JPG'); background-size: 100px;">
        <h2>아기상어 뚜루루뚜루</h2>
    </div>
    <!-- background-image : 배경으로 이미지 넣기
    background-image : url(이미지경로) 
    background-size: 너비 높이;  크기
    background-repeat: 이미지반복 repeat-x ,repeat-y ,repeat ,no-repeat
    background-position: x방향, y방향 (이미지이동)
                        x : →   y:↓
    -->
    <h3>반복 방향 x축</h3>
    <div style="width: 500px; height: 200px; border: 1px solid #333; 
    background-image: url('../../fff/PHIS3580.JPG'); background-size: 100px;
    background-repeat: no-repeat; background-position: 300px 50px;">
        <h2>아기상어 뚜루루뚜루</h2>
    </div>
