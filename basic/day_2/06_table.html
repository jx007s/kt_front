<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>06_table</title>
</head>
<body>
    <h1>06_table</h1>
    table(표) > tr(행) > td(칸) => 내용
    <!-- 
        border="1" : 테두리 (실제에서는 쓰지 않는 편)
        width : 너비  같은 크기 속성이 있을때 큰 값을 기준으로 한다. 
        height : 높이
        bgcolor : 배경색  크기우열이 없는 색상과 같은 속성인 경우 작은 영역이 우선순위
                          td > tr > table
    -->
    <table border="1" bgcolor="#ff0" cellpadding="0px" cellspacing="0px">
        <!-- 테이블에서내용 : 테이블에서 벗어남-->
        <tr bgcolor="#f0f">
            <!-- 행에서내용 : 테이블에서 벗어남 -->
            <td width="50px" height="30px" >칸1_1</td>
            <td width="50px" height="50px"  bgcolor="#0ff" >칸1_2</td>
            <td width="150px" height="20px" >칸1_3</td>
        </tr>
        <tr height="40px" >
            <td width="100px">칸2_1</td>
            <!-- colspan="2" : 칸(열) 갯수 차지,  지정된 칸의 오른쪽으로 2칸
                 rowspan="2" : 줄(행) 갯수 차지,  지정된 칸의 아래쪽으로 2칸
            -->
            <td height="50px" colspan="2">칸2_2</td>
            
        </tr>
        <tr>
            <td width="30px">칸3_1</td>
            <td rowspan="2">칸3_2</td>
            <td>칸3_3</td>
        </tr>
        <tr>
            <td width="70px">칸4_1</td>
            <td>칸4_3</td>
        </tr>
        <tr>
            <td colspan="3">
                <!-- 부모 객체의 크기를 이용하여 비율로 값지정-->
                <table bgcolor="#0f0" width="100%">
                    <tr>
                        <td width="40%">새칸1</td>
                        <td bgcolor="#0ff">새칸2</td>
                    </tr>
                </table>
            </td>
        </tr>
    </table>
    <!-- 07_diary.html , 테이블과제.png 를 참고하여 이번달달력을 구현하세요 
         
    -->
</body>
</html>
