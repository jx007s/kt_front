<html>
    <head>
        <title>제목이지롱</title>
        <!-- 
            주석 : 코드 진행에 영향을 미치지 않음
                   주로 설명이나 작업내용을 명시
        -->
    </head>

    <body bgcolor="yellow" style="color:#f00;">
        <!-- 
        bgcolor="yellow"  속성 : 태그안에 작성 - 태그의 특정 속성을 지정
        속성이름  속성값
        배경색   노랑색

        style="color:#f00;"
        속성이름   속성값
        모양     글자색:빨강색
        -->
        몸통이지롱 
        hello html
        <!-- 
        <>  태그 : html 문서의 요소 <태그이름> : 태그시작  </태그이름> 태그종료
        
        <div>내용내용</div>
        <div></div>
        <div/>    태그를 시작하고 바로 끝남을 표시
        -->
        <br>
        두번째 줄
        <br/>
        세번째 줄

    </body>
</html>
