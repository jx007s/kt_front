<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>03_overflow</title>
    <style>
        *{
            margin: 0;
            padding: 0;
        }
        img{
            width: 400px;
        }
        main{
            width: 200px;
            height: 400px;
            background-color: #ff0;
            margin: 20px;
            border: 5px solid #f00;
        }
        .hh{
            overflow: hidden; /* overflow : item의 크기가 현재 요소보다 클 경우 처리
                                 기본값 (visible), hidden - over하는 부분을 모두 안보이게       
            */
        }
        .sc{
            overflow: scroll;   /* item over 상관없이 스크롤바 생성 */
        }
        .au{
            overflow: auto;   /* item over 방향에 맞춰 스크롤바 생성 */
        }
        section{
            width: 300px;
            height: 250px;
            background-color: #ff0;
            margin: 20px;
            border: 5px solid #f00;
            overflow: auto;
           
        }
        section > div{
            width: 1200px;
            height: 200px;
           background-color: #0f0;
        }
        section > div > img{
            width: 300px;
            height: 200px;
            float: left;
        }
    </style>
</head>
<body>
    <h1>03_overflow</h1>
    <h2>기본</h2>
    <main><img src="../../fff/CDCL8013.JPG" alt=""></main>
    <h2>hidden</h2>
    <main class="hh"><img src="../../fff/CDCL8013.JPG" alt=""></main>
    <h2>scroll</h2>
    <main class="sc"><img src="../../fff/CDCL8013.JPG" alt=""></main>
    <h2>auto</h2>
    <main  class="au"><img src="../../fff/CDCL8013.JPG" alt=""></main>

    <section>
        <div>
            <img src="../../fff/sons/son_2.jpg">
            <img src="../../fff/sons/son_3.jpg">
            <img src="../../fff/sons/son_4.jpg">
            <img src="../../fff/sons/child_1.jpg">
        </div>
    </section>


</body>
</html>
