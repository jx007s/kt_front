<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>04_semantic</title>
    <style>
        *{
            margin: 0;
            padding: 0;
        }
        #wrapper{
            width: 800px;
            height: 700px;
            background-color: #ffa;
            margin: 30px auto;
        }
        #wrapper > div, header, nav, aside, main, article, section, footer{
            border: 1px solid #fa0;
            margin: 20px;
        }
    </style>
</head>
<body>
    <h1>04_semantic</h1>
    <div id="wrapper">
        <div>헤더입니다
            <div>상단메뉴바입니다</div>
        </div>
        <div>
            측면메뉴입니다
        </div>
        <div>메인입니다
            <div>글자들입니다</div>
            <div>구간입니다</div>
        </div>
        <div>바닥입니다</div>
    </div>

    <div id="wrapper">
        <header>헤더입니다
            <nav>상단메뉴바입니다</nav>
        </header>
        <aside>
            측면메뉴입니다
        </aside>
        <main>메인입니다
            <article>글자들입니다</article>
            <section>구간입니다</section>
        </main>
        <footer>바닥입니다</footer>
    </div>
</body>
</html>
