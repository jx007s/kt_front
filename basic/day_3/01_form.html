<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>01_form</title>
</head>
<body>
    <!--
    기본 개념: 사용자로부터 입력값을 받아 서버로 전송하거나 클라이언트 로직에서 처리하기 위한 대화형 요소 모음

<form>: 입력 요소들을 묶고 제출 방식(, method 등)을 지정하는 컨테이너
        action : 데이터 전송 종착URL => submit(commit) 등의 이벤트로 전송
        전송시 name=value 형태로 전송되며 & 로 항목을 구분한다
<label>: 입력 요소의 설명 라벨로, for 속성과 입력 요소의 id를 연결하면 라벨 클릭 시 해당 입력창에 포커스 이동 (접근성·사용성 향상)

<input>: 입력 type 속성에 따라 다양한 형태 제공
         type

<textarea>: 여러 줄의 긴 텍스트를 입력받는 영역 (행·열 크기 조절 가능)

<select> + <option>: 드롭다운 목록을 만들고 선택지(<option value="...">)를 제공

<button>: 폼 제출(type="submit"), 초기화(type="reset"), 일반 동작(type="button") 버튼을 생성
    
    -->
    <h1>01_form</h1>
    <form action="joinReg.html">
        <table border="">
            <tr>
                <td>아이디</td>
                <td><input name="pid">
                    <input type="button" value="중복확인">
                </td>
            </tr>
            <tr>
                <td>암호</td>
                <td><input name="pw" type="password"></td>
            </tr>
            <tr>
                <td>이름</td>
                <td><input name="pname" value="장동건"></td>
            </tr>
            <tr>
                <td>전화</td>
                <td><input name="pname" placeholder="숫자만입력하세요" size="10" maxlength="7"></td>
            </tr>
                <!--            수정    전송    보임
                    disabled    X        X      O
                    readonly    X        O      O
                type="hidden"   X        O      X
                -->
            <tr>
                <td>외국인</td>
                <td><input name="aa" value="외국외국" disabled></td>
            </tr>
            <tr>
                <td>거주</td>
                <td><input name="loc" value="기숙사" readonly></td>
            </tr>
            <tr>
                <td>구분</td>
                <td><input name="bb" value="학생" type="hidden"></td>
            </tr>
            <tr>
                <td>생년월일</td>
                <td>
                    <input name="br1" value="1998-08-09" type="date">
                    <input name="br2" value="15:17:23" type="time">
                </td>
            </tr>
            <tr>
                <td>학년</td>
                <td>
                    <input name="hh" type="number">
                </td>
            </tr>
            <tr>
                <td>전화</td>
                <td>
                    <input name="phone" type="tel">
                </td>
            </tr>
            <tr>
                <td>추천 email</td>
                <td>
                    <!-- 전송시 email 규칙 검사-->
                    <input name="email3" type="email">
                </td>
            </tr>
            <tr>
                <td>파일</td>
                <td>
                    <input name="ff" type="file">
                </td>
            </tr>
            <tr>
                <td>성별</td>
                <!--  radio : 1개만 선택 (name으로 묶음) -->
                <td>
                    <input name="gender" type="radio" value="m">남
                    <input name="gender" type="radio" value="f" checked>여
                    <input name="job" type="radio" value="it">IT인
                </td>
            </tr>
            <tr>
                <td>취미</td>
                <!--  checkbox : 다중 선택 (name으로 묶음) -->
                <td>
                    <input name="hobby" type="checkbox" value="game" checked>게임
                    <input name="hobby" type="checkbox" value="painting">그림
                    <input name="hobby" type="checkbox" value="stock" checked>주식
                </td>
            </tr>
            <tr>
                <td>이메일</td>
                <td>
                    <input name="email1" type="text">@
                    <select name="email2">
                        <option value="google.com">구글</option><!--google.com 전송-->
                        <option value="naver.com">네이버</option>
                        <option>네이트</option>
                        <option>다음</option><!--다음 전송-->
                    </select>
                </td>
            </tr>
            <tr>
                <td>남기실말</td>
                <!-- textarea : 다중행 데이터 입력
                일반적인 띄어쓰기와 줄바꿈을 그대로 사용 
                -->
                <td><textarea name="content" cols="50" rows="5">아부라카타부라
아기상어
엄마상어
                </textarea></td>
            </tr>
            <tr>
                <td colspan="2" align="center">
                    <input type="submit" value="가입1">
                    <!-- form 안의 button : submit 과 같은 기능 -->
                    <button>가입2</button>
                    <input type="reset" value="초기화">
                </td>
            </tr>
        </table>
    </form>

    <form action="sch.html">
        <select name="aaa" >
            <option>제목</option>
            <option>작성자</option>
            <option>내용</option>
        </select>
        <input type="text" name="bbb">
        <input type="submit" value="검색">
    </form>
</body>
</html>
<!-- 02_joinForm.html  회원가입 폼을 구성하세요 -->
